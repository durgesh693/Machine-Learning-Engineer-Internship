<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Churn Predictor</title>
    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background: #f4f6f8; 
            margin: 0; 
            padding: 40px 20px; 
            display: flex; 
            justify-content: center; 
        }
        .card { 
            background: #ffffff; 
            padding: 28px; 
            border-radius: 8px; 
            box-shadow: 0 2px 8px rgba(0,0,0,0.08); 
            width: 100%; 
            max-width: 460px; 
        }
        h2 { 
            margin: 0 0 16px 0; 
            color: #1a202c; 
            font-size: 20px; 
        }
        label { 
            display: block; 
            margin: 12px 0 4px; 
            font-size: 13px; 
            font-weight: 600; 
            color: #4a5568; 
        }
        input { 
            width: 100%; 
            padding: 8px 10px; 
            border: 1px solid #cbd5e0; 
            border-radius: 4px; 
            font-size: 14px; 
            outline: none;
        }
        input:focus {
            border-color: #3182ce;
        }
        button { 
            width: 100%; 
            margin-top: 20px; 
            padding: 10px; 
            background: #3182ce; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
        }
        button:hover { 
            background: #2b6cb0; 
        }
        .result-box { 
            margin-top: 20px; 
            padding: 14px; 
            border-radius: 6px; 
            text-align: center; 
            background: #edf2f7;
            border: 1px solid #cbd5e0;
        }
        .churn-risk {
            color: #c53030;
            background: #fff5f5;
            border-color: #feb2b2;
        }
        .retained-safe {
            color: #276749;
            background: #f0fff4;
            border-color: #9ae6b4;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Customer Churn Predictor</h2>
        <form action="/predict_form" method="post">
            <label>Customer Service Calls</label>
            <input type="number" step="1" name="customer_service_calls" value="1" required>

            <label>Cart Abandonment Rate (0.0 to 1.0)</label>
            <input type="number" step="0.01" min="0" max="1" name="cart_abandonment_rate" value="0.25" required>

            <label>High Cart Friction (0 = No, 1 = Yes)</label>
            <input type="number" step="1" min="0" max="1" name="high_cart_friction" value="0" required>

            <label>Days Since Last Purchase</label>
            <input type="number" step="1" min="0" name="days_since_last_purchase" value="15" required>

            <label>Digital Engagement Composite (-1.0 to 1.0)</label>
            <input type="number" step="0.01" min="-1" max="1" name="digital_engagement_composite" value="0.10" required>

            <button type="submit">Predict Risk</button>
        </form>

        {% if result %}
        <div class="result-box {% if 'High' in result.status %}churn-risk{% else %}retained-safe{% endif %}">
            <div style="font-size: 18px; font-weight: bold;">{{ result.status }}</div>
            <div style="font-size: 14px; margin-top: 4px;">Probability: {{ result.probability }}</div>
        </div>
        {% endif %}
    </div>
</body>
</html>
